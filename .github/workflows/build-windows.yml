name: Build Windows Application

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-flet.txt

      - name: Locate python-hwpx schema directory
        id: hwpx_schema
        run: |
          $schemaDir = python -c "import hwpx, os; print(os.path.join(os.path.dirname(hwpx.__file__), 'tools', '_schemas'))"
          if (-not (Test-Path $schemaDir)) {
            throw "python-hwpx schema directory not found: $schemaDir"
          }
          echo "path=$schemaDir" >> $env:GITHUB_OUTPUT

      - name: Package Windows executable with Flet
        run: |
          flet pack app_flet.py `
            --name GangseoCounselHWPX `
            --product-name "강서나눔돌봄센터 활동지원 서식 자동화" `
            --file-description "강서나눔돌봄센터 활동지원 서식 자동화 프로그램 (수요조사카드 · 중점사례 회의록)" `
            --add-data "counsel.hwpx;." `
            --add-data "meeting.hwpx;." `
            --add-data "${{ steps.hwpx_schema.outputs.path }};hwpx/tools/_schemas" `
            --hidden-import google.genai `
            --hidden-import hwpx `
            -y

      - name: Prepare release package folder
        run: |
          New-Item -ItemType Directory -Force -Path release_windows
          Copy-Item -Path dist\GangseoCounselHWPX.exe -Destination release_windows\
          Copy-Item -Path counsel.hwpx -Destination release_windows\
          Copy-Item -Path meeting.hwpx -Destination release_windows\
          @"
          ==================================================
          강서나눔돌봄센터 활동지원 서식 자동화 프로그램 (Windows)
          ==================================================

          1. 실행 방법:
             - GangseoCounselHWPX.exe 파일을 실행합니다.
             - 처음 실행 시 Windows 보호 경고창이 뜨면 [추가 정보] -> [실행]을 클릭합니다.

          2. 최초 설정:
             - 앱 왼쪽 사이드바 맨 아래의 [환경설정 및 API 키] 메뉴를 클릭합니다.
             - Google Gemini API Key를 입력하고 [API 키 저장]을 누릅니다.
             - 한 번 저장해 두면 다음 실행 시에도 자동으로 유지됩니다.

          3. 업무 구분 및 메뉴 구성:
             - 왼쪽 사이드바에서 [수요조사카드]와 [중점사례 회의록]이 명확히 구분되어 있습니다.
             - 각 업무별로 [입력 (AI 분석)] -> [서식 확인 및 HWPX] -> [문서함] 단계로 구성됩니다.
             - 상단 토글을 조작할 필요 없이 왼쪽 메뉴에서 원하는 서식과 단계를 바로 선택할 수 있습니다.

          4. HWPX 템플릿(counsel.hwpx / meeting.hwpx):
             - 서식 2종이 프로그램 내부에 내장되어 있으며, 본 폴더의 파일을 수정하여 서식을
               커스텀할 수도 있습니다.
          "@ | Out-File -FilePath release_windows\README.txt -Encoding utf8

      - name: Upload Windows distribution artifact
        uses: actions/upload-artifact@v4
        with:
          name: GangseoCounselHWPX-Windows
          path: release_windows/*
          if-no-files-found: error
          retention-days: 30

      - name: Compress release package into ZIP for release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          Compress-Archive -Path release_windows\* -DestinationPath GangseoCounselHWPX-Windows.zip -Force

      - name: Create GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: GangseoCounselHWPX-Windows.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
